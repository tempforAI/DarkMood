<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DARK MOOD — 美术预览</title>
<style>
  body { background: #0b0a10; color: #cfc8d8; font: 12px/1.4 "Menlo", "Consolas", monospace; margin: 16px; }
  h2 { color: #c9a25a; font-size: 15px; margin: 28px 0 8px; border-bottom: 1px solid #2a2433; padding-bottom: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .cell { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .lbl { color: #9a92a8; font-size: 11px; white-space: nowrap; }
  .lbl b { color: #e6dcef; font-weight: normal; }
  .row { display: flex; gap: 6px; align-items: flex-end; margin-bottom: 10px; }
  .rowname { width: 92px; color: #e6dcef; font-size: 12px; align-self: center; }
  .bgwrap { position: relative; }
  .portrait canvas { background: #2a2433; }
  .sprite canvas, .icon canvas { background: #3a3446; }
  #stats { color: #c9a25a; }
  .controls { margin: 6px 0 12px; color: #9a92a8; }
  .controls a { color: #8fb8ff; margin-right: 10px; }
</style>
</head>
<body>
<div>DARK MOOD：宵鸦岛审判 —— 程序化像素美术预览 <span id="stats"></span></div>
<div class="controls">
  <a href="?">全部</a><a href="?s=bg">背景</a><a href="?s=bg&anchors=1">背景+锚点</a><a href="?s=pt">立绘</a><a href="?s=sp">小人/图标/地图</a>
</div>
<div id="out"></div>

<script src="../js/data/characters.js"></script>
<script src="../js/data/locations.js"></script>
<script src="../js/art/palette.js"></script>
<script src="../js/art/pixel.js"></script>
<script src="../js/art/portraits.js"></script>
<script src="../js/art/backgrounds.js"></script>
<script src="../js/art/icons.js"></script>
<script src="../js/art/index.js"></script>
<script>
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); q[p[0]] = decodeURIComponent(p[1] || '1'); });
  var only = q.s ? q.s.split(',') : null;
  var showAnchors = !!q.anchors;
  var only_ids = q.ids ? q.ids.split(',') : null;
  function want(s) { return !only || only.indexOf(s) >= 0; }
  var out = document.getElementById('out');
  var stats = { bg: [], pt: [], sp: [], ic: [] };

  function timed(fn) { var t0 = performance.now(); var r = fn(); return { c: r, ms: performance.now() - t0 }; }
  function scaled(src, s) {
    var cv = document.createElement('canvas');
    cv.width = src.width * s; cv.height = src.height * s;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, cv.width, cv.height);
    return cv;
  }
  function cell(parent, canvas, label, cls) {
    var d = document.createElement('div');
    d.className = 'cell ' + (cls || '');
    d.appendChild(canvas);
    var l = document.createElement('div');
    l.className = 'lbl';
    l.innerHTML = label;
    d.appendChild(l);
    parent.appendChild(d);
    return d;
  }
  function section(title) {
    var h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
    var g = document.createElement('div'); g.className = 'grid'; out.appendChild(g);
    return g;
  }
  function withAnchors(src, loc) {
    var cv = scaled(src, 1);
    var ctx = cv.getContext('2d');
    var an = (loc && loc.anchors) || {};
    ctx.font = '10px monospace';
    Object.keys(an).forEach(function (k, i) {
      var r = an[k];
      ctx.strokeStyle = 'hsl(' + (i * 67 % 360) + ',90%,65%)';
      ctx.setLineDash([3, 2]);
      ctx.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillRect(r[0] + r[2] / 2 - 2, r[1] + r[3] / 2 - 2, 4, 4);
      ctx.fillText(k, r[0] + 2, r[1] + 10);
    });
    return cv;
  }

  // ---------- 背景 ----------
  if (want('bg')) {
    var g = section('背景 480x270（含变体）');
    var ids = Object.keys(DM.LOCS || {});
    ids.push('__unknown__');
    ids.forEach(function (id) {
      if (only_ids && only_ids.indexOf(id) < 0) return;
      var vars = [undefined].concat((DM.BG_VARIANTS && DM.BG_VARIANTS[id]) || []);
      vars.forEach(function (v) {
        var r = timed(function () { return DM.Art.getBackground(id, v); });
        stats.bg.push([id + (v ? ':' + v : ''), r.ms]);
        var c = showAnchors ? withAnchors(r.c, DM.LOCS[id]) : scaled(r.c, 1);
        cell(g, c, '<b>' + id + (v ? ':' + v : '') + '</b> ' + r.ms.toFixed(1) + 'ms', 'bg');
      });
    });
  }

  // ---------- 立绘 ----------
  if (want('pt')) {
    var gp = section('立绘 80x112 ×2（每角色 8 种表情）');
    gp.style.display = 'block';
    var chars = Object.keys(DM.CHARS || {});
    chars.push('__unknown__');
    chars.forEach(function (id) {
      if (only_ids && only_ids.indexOf(id) < 0) return;
      var row = document.createElement('div'); row.className = 'row';
      var nm = document.createElement('div'); nm.className = 'rowname';
      nm.textContent = id + (DM.CHARS[id] ? ' ' + DM.CHARS[id].name : '');
      row.appendChild(nm);
      DM.EXPRS.forEach(function (e) {
        var r = timed(function () { return DM.Art.getPortrait(id, e); });
        stats.pt.push([id + ':' + e, r.ms]);
        cell(row, scaled(r.c, +(q.ps || 2)), '<b>' + e + '</b> ' + r.ms.toFixed(1) + 'ms', 'portrait');
      });
      gp.appendChild(row);
    });
  }

  // ---------- 小人 / 图标 / 地图 ----------
  if (want('sp')) {
    var gs = section('小人 16x32 ×3');
    Object.keys(DM.CHARS || {}).concat(['__unknown__']).forEach(function (id) {
      var r = timed(function () { return DM.Art.getSprite(id); });
      stats.sp.push([id, r.ms]);
      cell(gs, scaled(r.c, 3), '<b>' + id + '</b> ' + r.ms.toFixed(1) + 'ms', 'sprite');
    });
    var gi = section('证据图标 16x16 ×3');
    var icons = 'knife key note letter rope string feather bottle pill photo book diary clock bell cloth paint shoe footprint tape recorder ring hairpin candle fire map blueprint plate glass cup violin card lamp window door cage sand boat cable wax sequin tooth doll testimony body generic __unknown__'.split(' ');
    icons.forEach(function (id) {
      var r = timed(function () { return DM.Art.getIcon(id); });
      stats.ic.push([id, r.ms]);
      cell(gi, scaled(r.c, 3), '<b>' + id + '</b> ' + r.ms.toFixed(1) + 'ms', 'icon');
    });
    var gm = section('地图 480x270（getMap，节点为 DM.AREAS 坐标）');
    var rm = timed(function () { return DM.Art.getMap(); });
    var mc = scaled(rm.c, 1);
    if (showAnchors || q.nodes) {
      var ctx = mc.getContext('2d');
      Object.keys(DM.AREAS).forEach(function (k) {
        var p = DM.AREAS[k].map;
        ctx.strokeStyle = '#ff0'; ctx.strokeRect(p[0] - 3, p[1] - 3, 6, 6);
        ctx.fillStyle = '#ff0'; ctx.font = '10px monospace'; ctx.fillText(k, p[0] + 5, p[1] - 4);
      });
    }
    cell(gm, mc, '<b>map</b> ' + rm.ms.toFixed(1) + 'ms');
  }

  // ---------- 统计 ----------
  function sum(a) { var s = 0, m = 0, mk = ''; a.forEach(function (x) { s += x[1]; if (x[1] > m) { m = x[1]; mk = x[0]; } }); return { n: a.length, total: s, max: m, maxKey: mk, avg: a.length ? s / a.length : 0 }; }
  var lines = [];
  Object.keys(stats).forEach(function (k) {
    var s = sum(stats[k]);
    if (!s.n) return;
    lines.push(k + ': n=' + s.n + ' total=' + s.total.toFixed(1) + 'ms avg=' + s.avg.toFixed(2) + 'ms max=' + s.max.toFixed(1) + 'ms (' + s.maxKey + ')');
  });
  document.getElementById('stats').textContent = ' | ' + lines.join(' | ');
  console.log('ART_STATS ' + JSON.stringify(stats));
  console.log('ART_SUMMARY ' + lines.join(' ; '));
  // 缓存检查
  if (want('bg') && DM.Art.getBackground('hall') !== DM.Art.getBackground('hall')) console.error('cache miss: background');
  if (want('pt') && DM.Art.getPortrait('ritsu', 'smile') !== DM.Art.getPortrait('ritsu', 'smile')) console.error('cache miss: portrait');
  window.__ART_DONE = true;
})();
</script>
</body>
</html>
